name: Build and test Android phase map
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download updated project
        run: |
          curl --fail --location --silent --show-error 'https://share.zapia.com/racqfxod9e8nvxlnpf2hwm' -o game.zip
          unzip -q game.zip
          grep -q 'id="phaseGrid"' android-template/app/src/main/assets/www/index.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed test APK
        working-directory: android-template
        run: gradle --no-daemon assembleRelease
      - name: Validate APK signature and contents
        run: |
          APK=android-template/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" | tail -2
          unzip -p "$APK" assets/www/index.html | grep -q 'id="phaseGrid"'
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --verbose "$APK"
          mkdir -p release
          cp "$APK" release/Turma-da-Lume-mapa-fases.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch and test phase map
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r release/Turma-da-Lume-mapa-fases.apk
            adb shell am start -n com.turmadalume.cacatesouro/.MainActivity
            sleep 40
            adb shell pidof com.turmadalume.cacatesouro
            adb shell input swipe 160 560 160 280 400
            sleep 2
            adb shell uiautomator dump /sdcard/start.xml
            adb pull /sdcard/start.xml release/start.xml
            python3 -c "import xml.etree.ElementTree as E,re,subprocess; r=E.parse('release/start.xml'); b=next(n.get('bounds') for n in r.iter('node') if 'Ver fases' in (n.get('text') or '')); x1,y1,x2,y2=map(int,re.findall(r'\d+',b));subprocess.run(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)],check=True)"
            sleep 5
            adb exec-out screencap -p > release/mapa.png
            adb shell uiautomator dump /sdcard/map.xml
            adb pull /sdcard/map.xml release/map.xml
            grep -q 'Mapa das fases' release/map.xml
            grep -q '1.000' release/map.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lume-mapa-check
          path: release/
